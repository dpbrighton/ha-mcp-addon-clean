name: Home Assistant MCP Server
slug: ha_mcp_clean
description: MCP server for Home Assistant — exposes HA to AI for dashboards and automations
version: "1.0.0"

startup: application
boot: auto
init: false

arch:
  - amd64
  - aarch64
  - armv7
  - armhf

# Add-on option for the long-lived token
options:
  ha_token: ""

# Schema for validation
schema:
  ha_token: str

# Environment variable for the container
environment:
  HA_TOKEN: "!ha_token"

# Expose the API port
ports:
  8000/tcp: 8000

ports_description:
  8000/tcp: MCP API server

host_network: true
